<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <h1>📝 My Todo App</h1>
        <p class="subtitle">Organize your tasks efficiently</p>
      </header>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Input Section -->
        <section class="input-section">
          <div class="input-group">
            <input
              type="text"
              id="todoInput"
              class="todo-input"
              placeholder="Add a new task..."
              autocomplete="off"
            />
            <button id="addBtn" class="btn btn-primary">Add Task</button>
          </div>

          <!-- Additional Fields -->
          <div class="form-row">
            <div class="form-group">
              <label for="prioritySelect">Priority:</label>
              <select id="prioritySelect" class="select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="form-group">
              <label for="descInput">Description:</label>
              <input
                type="text"
                id="descInput"
                class="input"
                placeholder="Optional description"
              />
            </div>
          </div>
        </section>

        <!-- Filter Section -->
        <section class="filter-section">
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">
              Completed
            </button>
          </div>
          <div class="priority-filter">
            <label for="priorityFilter">Filter by priority:</label>
            <select id="priorityFilter" class="select">
              <option value="">All Priorities</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </section>

        <!-- Stats -->
        <section class="stats-section">
          <div class="stat">
            <span class="stat-label">Total:</span>
            <span class="stat-value" id="totalCount">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Completed:</span>
            <span class="stat-value" id="completedCount">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Pending:</span>
            <span class="stat-value" id="pendingCount">0</span>
          </div>
        </section>

        <!-- Todo List -->
        <section class="todos-section">
          <div id="todoList" class="todo-list">
            <div class="empty-state">
              <p>🎉 No tasks yet. Create one to get started!</p>
            </div>
          </div>
        </section>

        <!-- Action Buttons -->
        <section class="action-buttons">
          <button id="clearBtn" class="btn btn-danger">Clear Completed</button>
          <button id="deleteAllBtn" class="btn btn-danger">Delete All</button>
        </section>
      </main>

      <!-- Loading Spinner -->
      <div id="loadingSpinner" class="spinner hidden"></div>

      <!-- Toast Notification -->
      <div id="toast" class="toast"></div>
    </div>

    <script src="javascripts/app.js"></script>
  </body>
</html>
